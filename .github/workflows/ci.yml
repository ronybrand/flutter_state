name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned: the same Flutter everywhere, and a version bump is a reviewed change.
  FLUTTER_VERSION: 3.47.7

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  # `flutter test` alone does not prove the app compiles for a platform: the web
  # build runs the real compiler, and the Android build also checks the Gradle
  # project (manifest, permissions, plugin versions).
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  # Proves the release signing wiring with a throwaway key, since the real one is
  # (rightly) not available to CI on pull requests.
  signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: A release app bundle without a key refuses to build
        run: |
          if flutter build appbundle --release > bundle.log 2>&1; then
            echo "::error::an app bundle was built without android/key.properties"
            exit 1
          fi
          grep -q "Refusing to build a release app bundle" bundle.log

      # keytool makes PKCS12 keystores, where the key password must equal the keystore password.
      - name: Create a throwaway key and point key.properties at it
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" \
            -storepass ci-pass -keypass ci-pass -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Throwaway, O=flutter_state"
          bash scripts/ci/write-key-properties.sh
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.jks
          KEYSTORE_PASSWORD: ci-pass
          KEY_PASSWORD: ci-pass
          KEY_ALIAS: ci

      - name: A release APK is signed with that key, not the debug one
        run: |
          flutter build apk --release
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -q "CN=CI Throwaway" certs.txt
          ! grep -q "Android Debug" certs.txt

  # CodeQL does not analyze Dart, so the repository (pubspec.lock vulnerabilities,
  # committed secrets, misconfiguration) is scanned with Trivy instead.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
