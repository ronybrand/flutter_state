name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned: the same Flutter everywhere, and a version bump is a reviewed change.
  FLUTTER_VERSION: 3.47.7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  # `flutter test` alone does not prove the app compiles for a platform: the web build
  # runs the real compiler. (The Android project is compiled by the `signing` job below,
  # in release, which is a superset of a debug build.)
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  # Proves the release signing wiring with a throwaway key, since the real one is
  # (rightly) not available to CI on pull requests. It also compiles the whole Android
  # project in release. Only arm64 is built: the AOT compile runs once per ABI, and the
  # signature is the same whichever one is inside the APK.
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Gradle dependencies and the wrapper. It only writes from main; a pull request reads what
      # main saved.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: A release app bundle without a key refuses to build
        run: |
          if flutter build appbundle --release --target-platform android-arm64 > bundle.log 2>&1; then
            echo "::error::an app bundle was built without android/key.properties"
            exit 1
          fi
          grep -q "Refusing to build a release app bundle" bundle.log

      # keytool makes PKCS12 keystores, where the key password must equal the keystore password.
      - name: Create a throwaway key and point key.properties at it
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" \
            -storepass ci-pass -keypass ci-pass -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Throwaway, O=flutter_state"
          bash scripts/ci/write-key-properties.sh
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.jks
          KEYSTORE_PASSWORD: ci-pass
          KEY_PASSWORD: ci-pass
          KEY_ALIAS: ci

      - name: A release APK is signed with that key, not the debug one
        run: |
          flutter build apk --release --target-platform android-arm64
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -q "CN=CI Throwaway" certs.txt
          ! grep -q "Android Debug" certs.txt

  # CodeQL does not analyze Dart, so the repository (pubspec.lock vulnerabilities,
  # committed secrets, misconfiguration) is scanned with Trivy instead.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
