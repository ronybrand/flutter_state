name: Setup GitHub Topics

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Topics
        uses: actions/github-script@v7
        with:
          script: |
            const topics = [
              'flutter',
              'dart',
              'cross-platform',
              'mobile-app',
              'android',
              'ios',
              'web',
              'riverpod',
              'state-management',
              'go-router',
              'material-design',
              'rest-api',
              'spring-boot',
              'dio',
              'flutter-secure-storage',
              'testing',
              'flutter-test',
              'widget-tests',
              'ci-cd',
              'github-actions',
              'security',
              'accessibility',
              'internationalization',
              'i18n'
            ];
            
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: topics
            });
