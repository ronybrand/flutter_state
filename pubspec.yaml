name: flutter_state
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Launcher icons for Android (adaptive + monochrome), iOS and web, generated from
# assets/branding with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  # App Store icons must not have an alpha channel.
  remove_alpha_ios: true
  adaptive_icon_background: "#155E63"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#155E63"
    theme_color: "#155E63"

# Native launch screen (shown while the Flutter engine starts, and while main()
# reads the session from the keychain), generated with
# `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#155E63"
  image: assets/branding/splash.png
  android_12:
    color: "#155E63"
    image: assets/branding/splash.png
    icon_background_color: "#155E63"
  web: true
